<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Facial Emotion Recognition">
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6A6CF6"/>
      <stop offset="50%" stop-color="#5B5FE9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="sheen" cx="22%" cy="14%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#sheen)"/>

  <!-- Detection viewfinder corners -->
  <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M 148 92 L 118 92 Q 92 92 92 118 L 92 148"/>
    <path d="M 364 92 L 394 92 Q 420 92 420 118 L 420 148"/>
    <path d="M 92 364 L 92 394 Q 92 420 118 420 L 148 420"/>
    <path d="M 420 364 L 420 394 Q 420 420 394 420 L 364 420"/>
  </g>

  <!-- Eyes -->
  <circle cx="188" cy="216" r="24" fill="#FFFFFF"/>
  <circle cx="324" cy="216" r="24" fill="#FFFFFF"/>

  <!-- Smile -->
  <path d="M 160 300 C 196 366 316 366 352 300" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" fill="none"/>
</svg>
