name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: 后端测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.8 为项目基准版本（Docker 镜像），3.10 为开发机常用版本
        python-version: ['3.8', '3.10']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 静态检查（ruff）
        run: python -m ruff check src/ main.py gunicorn.conf.py

      - name: 运行测试（pytest）
        env:
          JWT_SECRET_KEY: ci-test-secret-key
        run: python -m pytest tests/ -v --tb=short

  frontend-build:
    name: 前端构建 (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 上传构建产物
        if: matrix.node-version == '20'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  docker-build:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v7

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建后端镜像（验证 Dockerfile 与 entrypoint）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: facelens-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 后端镜像运行冒烟（cv2 / 视频IO / 设置加载）
        run: |
          docker run --rm --entrypoint python facelens-backend:ci -c "
          import cv2, numpy as np
          print('cv2', cv2.__version__)
          p = '/tmp/s.mp4'
          w = cv2.VideoWriter(p, cv2.VideoWriter_fourcc(*'mp4v'), 10, (64, 64))
          for i in range(5):
              w.write(np.full((64, 64, 3), 128, dtype=np.uint8))
          w.release()
          cap = cv2.VideoCapture(p)
          ret, _ = cap.read()
          cap.release()
          assert ret, 'VideoCapture failed'
          from src.config.settings import MODEL_PATHS
          print('backend image smoke ok')
          "

      - name: 构建前端镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: facelens-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
